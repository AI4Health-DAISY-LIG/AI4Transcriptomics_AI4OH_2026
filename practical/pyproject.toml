[project]
name = "ai4transcriptomics-practical"
version = "0.1.0"
description = "Practical: reproduce parts of Wang et al. 2019 (FSHD muscle biopsies, GSE115650) from the deposited counts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pydeseq2>=0.5",
    "tabulate>=0.9",
    "certifi>=2026.11.20",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
